name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build, Safety & Release Verify (Node 24 LTS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Frontend secret-safety sanity check
        run: npm run check:secrets

      - name: Deterministic dependency install (npm ci)
        run: npm ci

      - name: High-severity dependency audit
        run: npm audit --audit-level=high

      - name: PWA static-asset integrity validation
        run: npm run check:pwa

      - name: Source safety lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Safety invariant tests
        run: npm test

      - name: Production Vite build
        run: npm run build

      - name: Production release smoke check
        run: npm run check:release
